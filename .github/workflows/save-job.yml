name: Save a job

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: scan          # never write data at the same time as a scan
  cancel-in-progress: false

jobs:
  save:
    # only you (the repo owner) can add jobs, and only through the "Save a job" form
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Save job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Save the job
        id: save
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPLY_FILE: ${{ runner.temp }}/comment.md
        run: |
          [ -z "$LLM_BASE_URL" ] && unset LLM_BASE_URL
          [ -z "$LLM_MODEL" ] && unset LLM_MODEL
          [ -z "$LLM_API_KEY" ] && unset LLM_API_KEY
          python -m jobwatch.add_job
      - name: Commit
        if: steps.save.outcome == 'success'
        run: |
          git config user.name  "jobwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Save job from issue #${{ github.event.issue.number }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
      - name: Reply on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ steps.save.outcome }}
        run: |
          f="${{ runner.temp }}/comment.md"
          [ -s "$f" ] || echo "❌ Something went wrong saving this job — see the Actions log." > "$f"
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$f"
          if [ "$OK" = "success" ]; then gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"; fi

  publish:
    needs: save
    uses: ./.github/workflows/pages.yml
