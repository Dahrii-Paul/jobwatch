# ─────────────────────────────────────────────────────────────
#  Your candidate profile — the agent scores every job against this.
#  Edit freely; no code changes needed.
# ─────────────────────────────────────────────────────────────

name: "Bioinformatics / Computational Biology candidate"

# One paragraph the AI reads to judge fit. Be specific.
summary: >
  PhD in Bioinformatics. Expertise in machine learning, genomics, NGS,
  computational biology and multi-omics: ML-based biomarker discovery,
  urinary and blood proteomics, and current tuberculosis whole-genome
  sequencing (WGS) / pathogen genomics work at JIPMER. Hands-on R/Python,
  Linux/HPC and NGS pipelines.
  Track A — permanent posts in India: Assistant / Associate Professor,
  Scientist B/C/D/E (ICMR, DBT/BRIC, CSIR, DST, ICAR), research scientist and
  equivalent scientific posts.
  Track B — research positions in India and abroad: Postdoctoral Fellow,
  Institute Postdoctoral Fellow, Research Associate I/II/III, Project Research
  Scientist I/II/III, and DBT/DST/ICMR/ANRF-funded fellowships.
  Relevant departments are not only Bioinformatics but also Computational
  Biology, Genomics, Systems Biology, Biotechnology, Life/Biological/Biomedical
  Sciences and Data Science. Not interested in JRF/SRF, project assistant,
  technician or PhD positions.

# Which kinds of posts to show by default on the dashboard
# (others are still collected and can be toggled on).
include_categories: [permanent, postdoc, fellowship, project]
# project = Project Research Scientist / Project Associate (PhD-level project posts).
# Also known but hidden: junior (JRF, SRF, project assistant, technician), phd, other

# Minimum relevance (0–100) for a job to count as a "match"
match_threshold: 40

