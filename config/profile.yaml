# ─────────────────────────────────────────────────────────────
#  Your candidate profile — the agent scores every job against this.
#  Edit freely; no code changes needed.
# ─────────────────────────────────────────────────────────────

name: "Bioinformatics / Computational Biology candidate"

# One paragraph the AI reads to judge fit. Be specific.
summary: >
  PhD-level researcher in bioinformatics and computational biology with
  hands-on genomics and NGS data analysis (WGS/WES, RNA-seq, single-cell,
  variant calling, metagenomics), pipeline development (Nextflow/Snakemake),
  R/Python, Linux/HPC and statistical / machine-learning methods for omics.
  Looking for (1) permanent positions in India — Scientist B/C/D (ICMR, DBT/BRIC,
  CSIR, DST, ICAR), Assistant Professor / faculty in bioinformatics,
  biotechnology or allied life sciences; and (2) postdoctoral positions and
  fellowships in India and abroad in bioinformatics, computational biology,
  genomics and allied areas.

# Which kinds of posts to show by default on the dashboard
# (others are still collected and can be toggled on).
include_categories: [permanent, postdoc, fellowship]
# Other categories the classifier knows: project (JRF/SRF/project scientist), phd, other

# Minimum relevance (0–100) for a job to count as a "match"
match_threshold: 40

