# ─────────────────────────────────────────────────────────────
#  Sources the agent watches.  Add / remove / disable freely.
#
#  Fields
#   id               unique short id
#   name             display name
#   region           india | abroad
#   country          country name (for abroad)
#   type             html (default) | rss | wordpress
#   urls             one or more URLs, tried in order until one works
#   topic_filtered   true if the listing is already a bioinformatics search
#   life_science     true for life-science institutes (permanent "Scientist"
#                    adverts there are flagged as possibly relevant even if
#                    the title does not name the subject)
#   link_pattern     optional regex — only links whose URL matches are kept
#   default_category optional — permanent | postdoc | fellowship
#   follow_details   open each candidate's page/PDF to find deadline & subject (default true)
#   render           true = load with a headless browser (JS-only sites)
#   verified         true = URL & structure confirmed when this repo was built
#   enabled          false to skip
#
#  After your first run, open  data/health.json  (or the "Sources" tab on the
#  dashboard) to see which sources returned items and fix any that return 0.
# ─────────────────────────────────────────────────────────────

sources:

